name: Build MAMAD GA Wallet Finder APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'MAMAD_GA_WALLET_FINDER_CLEAN_UPLOAD.zip'
      - '**/*.kt'
      - '**/*.kts'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project archive if present
        shell: bash
        run: |
          if [ -f MAMAD_GA_WALLET_FINDER_CLEAN_UPLOAD.zip ]; then
            mkdir -p extracted
            unzip -q MAMAD_GA_WALLET_FINDER_CLEAN_UPLOAD.zip -d extracted
          fi

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT_DIR="$PWD"
          else
            SETTINGS_FILE="$(find "$PWD" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' | head -n 1)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "Could not find settings.gradle(.kts) in repository or uploaded archive."
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon test assembleDebug
          else
            gradle --no-daemon test assembleDebug
          fi

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: MAMAD-GA-WALLET-FINDER-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
