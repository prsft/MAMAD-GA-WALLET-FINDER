name: Build MAMAD GA Wallet Finder APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Extract uploaded project archive
        shell: bash
        run: |
          if [ -f MAMAD_GA_WALLET_FINDER_CLEAN_UPLOAD.zip ]; then
            mkdir -p extracted
            unzip -oq MAMAD_GA_WALLET_FINDER_CLEAN_UPLOAD.zip -d extracted
          fi

      - name: Locate Android app module
        shell: bash
        run: |
          PROJECT_DIR=""
          APP_BUILD="$(find "$PWD" -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -not -path '*/.gradle/*' | sort | head -n 1)"
          if [ -n "$APP_BUILD" ]; then
            PROJECT_DIR="$(dirname "$(dirname "$APP_BUILD")")"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android app module found. Files in repository:"
            find . -maxdepth 6 -type f | sort | head -300
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project at $PROJECT_DIR"

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon test assembleDebug

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: MAMAD-GA-WALLET-FINDER-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: error
